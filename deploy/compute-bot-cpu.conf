# compute-bot: lets the runner (group compute) slow the CPU at night so the fans stay quiet (/noc in the bot).
# Applied at every boot; without it /noc only pauses hot jobs. Not an Intel CPU: the lines do nothing.
z /sys/devices/system/cpu/intel_pstate/no_turbo     0664 root compute -
z /sys/devices/system/cpu/intel_pstate/max_perf_pct 0664 root compute -
