<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>compute-bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #fff);
  --text: var(--tg-theme-text-color, #111);
  --hint: var(--tg-theme-hint-color, #8a8a8e);
  --link: var(--tg-theme-link-color, #2481cc);
  --btn: var(--tg-theme-button-color, #2481cc);
  --btn-text: var(--tg-theme-button-text-color, #fff);
  --sec: var(--tg-theme-secondary-bg-color, #efeff4);
  --section: var(--tg-theme-section-bg-color, var(--bg));
  --sh: var(--tg-theme-section-header-text-color, var(--hint));
  --sub: var(--tg-theme-subtitle-text-color, var(--hint));
  --danger: var(--tg-theme-destructive-text-color, #e53935);
  --sep: rgba(128, 128, 128, .22);
  --warn: #e6a100;
  --st: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  --sb: calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px));
  --sl: calc(var(--tg-safe-area-inset-left, 0px) + var(--tg-content-safe-area-inset-left, 0px));
  --sr: calc(var(--tg-safe-area-inset-right, 0px) + var(--tg-content-safe-area-inset-right, 0px));
  --mono: ui-monospace, "SF Mono", Menlo, "Roboto Mono", Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--sec); }
body {
  margin: 0; min-height: 100vh; background: var(--sec); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Segoe UI", sans-serif;
  padding: calc(var(--st) + 10px) calc(var(--sr) + 12px) calc(var(--sb) + 28px) calc(var(--sl) + 12px);
  -webkit-text-size-adjust: 100%; overscroll-behavior-y: contain;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .5; }
h1 { font-size: 20px; margin: 4px 4px 2px; word-break: break-word; }
.sub { color: var(--sub); font-size: 13px; margin: 0 4px 10px; }
.hint { color: var(--hint); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); }
.sh { color: var(--sh); font-size: 13px; text-transform: uppercase; letter-spacing: .03em; margin: 18px 4px 6px;
  display: flex; justify-content: space-between; align-items: baseline; }
.sh .link { text-transform: none; }
.sec { background: var(--section); border-radius: 12px; margin: 0 0 12px; overflow: hidden; }
.pad { padding: 12px; }
.row { display: flex; gap: 10px; padding: 10px 12px; align-items: center; min-height: 44px; }
.row + .row { border-top: 1px solid var(--sep); }
.row .grow { flex: 1; min-width: 0; }
.tap { cursor: pointer; }
.tap:active { background: var(--sec); }
.ico { font-size: 20px; width: 26px; text-align: center; flex: none; }
.title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { color: var(--hint); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--hint); flex: none; }
.btn { background: var(--btn); color: var(--btn-text); border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.btn.ghost { background: var(--sec); color: var(--link); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn.sm { padding: 6px 10px; font-size: 13.5px; border-radius: 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
.link { color: var(--link); background: none; border: 0; padding: 0; }
.health { display: flex; align-items: center; gap: 10px; padding: 12px; }
.health .big { font-size: 26px; }
.health .grow { flex: 1; min-width: 0; }
.gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--sep); border-top: 1px solid var(--sep); }
.gauge { background: var(--section); padding: 10px 12px; }
.gauge b { display: block; font-size: 18px; }
.gauge .lbl { color: var(--hint); font-size: 12px; }
.bar { height: 5px; background: var(--sec); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--btn); border-radius: 3px; }
.bar.warn i { background: var(--warn); } .bar.hot i { background: var(--danger); }
.spark { width: 100%; height: 46px; display: block; }
.sp-t { fill: none; stroke: var(--btn); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.sp-l { fill: none; stroke: var(--hint); stroke-width: 1.5; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.sp-h { stroke: var(--danger); stroke-width: 1; stroke-dasharray: 2 4; vector-effect: non-scaling-stroke; opacity: .6; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--hint); font-size: 12px; margin-top: 4px; }
.legend .t { color: var(--btn); }
.pbar { height: 4px; background: var(--sec); border-radius: 2px; overflow: hidden; margin: 5px 0 2px; }
.pbar i { display: block; height: 100%; background: var(--btn); }
.eta { color: var(--sub); font-size: 12.5px; }
.badge { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 9px; background: var(--sec); color: var(--hint); vertical-align: 1px; }
.badge.on { background: var(--btn); color: var(--btn-text); }
pre { margin: 0; font: 12.5px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; }
pre.block { background: var(--sec); padding: 10px; border-radius: 8px; overflow-x: auto; }
pre.nowrap { white-space: pre; word-break: normal; }
pre.log { max-height: 55vh; overflow: auto; }
details > summary { list-style: none; padding: 12px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "›"; color: var(--hint); transition: transform .15s; }
details[open] > summary::after { transform: rotate(90deg); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td { padding: 6px 12px; border-top: 1px solid var(--sep); vertical-align: top; word-break: break-word; }
td:first-child { color: var(--hint); width: 45%; }
tr.nd td:last-child { font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; padding: 0 12px 12px 48px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--hint); }
.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 12px; }
.gallery button { padding: 0; border: 0; background: var(--sec); border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 3; }
.gallery img { width: 100%; height: 100%; object-fit: contain; background: #fff; display: block; }
.file .name { font-family: var(--mono); font-size: 13px; word-break: break-all; }
.file .dir { color: var(--hint); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--sec); font-size: 20px; }
.stepper input { width: 70px; text-align: center; }
input[type=text], input[type=search], select {
  width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--sec); border: 1px solid transparent;
  border-radius: 9px; padding: 8px 10px; outline: none; -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--hint) 50%), linear-gradient(135deg, var(--hint) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
input:focus, select:focus { border-color: var(--btn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.chip { border: 1px solid var(--sep); border-radius: 16px; padding: 5px 11px; background: var(--sec); font-size: 13.5px; }
.chip.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
.seg { display: flex; background: var(--sec); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 7px; padding: 7px 4px; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.seg button.on { background: var(--section); color: var(--link); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.sw { position: relative; display: inline-block; width: 50px; height: 30px; flex: none; }
.sw input { opacity: 0; width: 0; height: 0; position: absolute; }
.sw span { position: absolute; inset: 0; background: var(--sep); border-radius: 15px; transition: background .15s; }
.sw span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.sw input:checked + span { background: var(--btn); }
.sw input:checked + span::after { transform: translateX(20px); }
.v3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.v3 label { font-size: 12px; color: var(--hint); }
.prm { padding: 11px 12px; border-top: 1px solid var(--sep); }
.prm:first-child, summary + .prm { border-top: 0; }
.prm-h { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 7px; }
.prm-h .lbl { flex: 1; }
.prm-h .key { font-family: var(--mono); font-size: 12px; color: var(--hint); margin-left: 6px; }
.prm .foot { font-size: 12px; color: var(--hint); margin-top: 5px; word-break: break-word; }
.prm .chg-b, .prm .rst { display: none; }
.prm.chg .chg-b { display: inline-block; margin-left: 6px; }
.prm.chg .rst { display: inline; font-size: 12px; }
.prm.chg { box-shadow: inset 3px 0 0 var(--btn); }
.prm.bad { box-shadow: inset 3px 0 0 var(--danger); }
.prm.bad input { border-color: var(--danger); }
.prm .err { color: var(--danger); font-size: 13px; margin-top: 4px; }
.prm .err:empty { display: none; }
.prm.off { opacity: .45; }
.alert { padding: 10px 12px; border-radius: 10px; margin: 0 0 12px; background: rgba(229, 57, 53, .13); }
.alert.info { background: var(--section); }
.alert b { color: var(--danger); }
.empty { text-align: center; padding: 26px 16px; color: var(--hint); }
.empty .e { font-size: 34px; display: block; margin-bottom: 6px; }
.sk { background: linear-gradient(90deg, var(--sec) 25%, var(--section) 50%, var(--sec) 75%); background-size: 200% 100%;
  animation: sk 1.3s infinite linear; border-radius: 7px; height: 14px; margin: 8px 0; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }
#banner { position: sticky; top: calc(var(--st) + 4px); z-index: 20; margin: 0 0 10px; display: none; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 10px; background: var(--text); color: var(--bg); font-size: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
#banner.show { display: flex; }
#banner .grow { flex: 1; }
#banner button { background: var(--btn); color: var(--btn-text); border: 0; border-radius: 8px; padding: 5px 10px; font-weight: 600; }
#ptr { position: fixed; left: 0; right: 0; top: calc(var(--st) + 2px); text-align: center; color: var(--hint); font-size: 13px; z-index: 30;
  transform: translateY(-40px); opacity: 0; pointer-events: none; }
#toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 18px); transform: translate(-50%, 20px); opacity: 0; transition: .2s;
  background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: 90vw; pointer-events: none; }
#toast.show { opacity: .95; transform: translate(-50%, 0); }
#toast.bad { background: var(--danger); color: #fff; }
#ov { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.94); color: #fff; overflow: auto; display: none;
  padding: calc(var(--st) + 12px) calc(var(--sr) + 8px) calc(var(--sb) + 20px) calc(var(--sl) + 8px); }
#ov.show { display: block; }
#ov img { width: 100%; height: auto; display: block; background: #fff; border-radius: 4px; }
#ov .bar2 { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
#ov .bar2 .grow { flex: 1; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
#ov pre { color: #eee; }
#ov .btn.ghost { background: rgba(255,255,255,.14); color: #fff; }
.back { margin: 0 4px 8px; }
.h1row { display: flex; align-items: center; gap: 8px; }
.h1row h1 { flex: 1; min-width: 0; }
.h1row .btn { flex: none; }
.h1row .btn.ghost { background: var(--section); }
.help { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; background: var(--section); color: var(--link); font-weight: 700; font-size: 16px; }
.start { text-align: center; padding: 22px 16px 18px; }
.start .e { font-size: 40px; display: block; }
.start h2 { margin: 6px 0 4px; font-size: 19px; }
.start p { margin: 0 0 14px; color: var(--hint); }
.start .btn { width: 100%; padding: 12px 14px; font-size: 16px; }
.guide { font-size: 16px; line-height: 1.58; white-space: pre-wrap; word-break: break-word; padding: 14px; }
.guide b { font-weight: 650; }
.guide code { font: 14px/1.4 var(--mono); background: var(--sec); color: var(--text); padding: 2px 6px; border-radius: 6px; cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.guide pre { font: 13px/1.5 var(--mono); background: var(--sec); padding: 10px 12px; border-radius: 9px; margin: 6px 0; white-space: pre; word-break: normal; overflow-x: auto; cursor: pointer; }
.guide pre code { background: none; padding: 0; font: inherit; }
.guide code:active, .guide pre:active { opacity: .6; }
.guide .copied { outline: 2px solid var(--btn); outline-offset: 1px; }
.dl { padding: 0 12px 12px; }
.dl .url { font: 12px/1.4 var(--mono); word-break: break-all; background: var(--sec); border-radius: 8px; padding: 8px 10px; -webkit-user-select: all; user-select: all; }
.dl .btns { padding: 8px 0 4px; }
.center { text-align: center; padding: 50px 20px; }
.center .e { font-size: 52px; }
</style>
</head>
<body>
<div id="ptr">↓ Przeciągnij, aby odświeżyć</div>
<div id="banner"><span class="grow" id="bannerText"></span><button type="button" data-act="retryNet">Spróbuj ponownie</button></div>
<main id="app"><div class="sk" style="width:40%;height:22px"></div><div class="sk"></div><div class="sk"></div></main>
<div id="ov"></div>
<div id="toast"></div>
<script>
'use strict';
/* compute-bot Mini App: Kolejka → Zadanie N → Formularz parametrów → Podsumowanie. Strona nie niesie żadnych danych:
   wszystko przychodzi z /api (ten sam adres) z podpisanym initData w nagłówku X-Init-Data. Bez frameworków. */

// ---------- Telegram -------------------------------------------------------------------------------------------------
const tg = (window.Telegram && window.Telegram.WebApp) || null;
const initData = (tg && tg.initData) || '';
const ver = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
const tryTg = fn => { try { fn(); } catch (e) { /* starsza wersja Telegrama */ } };
let mainFn = null, mainBusy = false;
if (tg) {
  tryTg(() => tg.ready());
  tryTg(() => tg.expand());
  if (ver('6.1')) tryTg(() => { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); });
  if (ver('7.7')) tryTg(() => tg.disableVerticalSwipes());  // inaczej przeciągnięcie w dół zamyka panel zamiast odświeżać
  tryTg(() => tg.MainButton.onClick(() => { if (mainFn && !mainBusy) mainFn(); }));
  if (ver('6.1')) tryTg(() => tg.BackButton.onClick(() => back()));
}
function haptic(kind) {
  if (!ver('6.1')) return;
  tryTg(() => {
    const H = tg.HapticFeedback;
    if (kind === 'success' || kind === 'error' || kind === 'warning') H.notificationOccurred(kind);
    else if (kind === 'select') H.selectionChanged();
    else H.impactOccurred('light');
  });
}
function confirmBox(msg) {
  return new Promise(res => {
    if (ver('6.2') && tg.showConfirm) tg.showConfirm(msg, ok => res(!!ok));
    else res(window.confirm(msg));
  });
}
function setMain(text, fn) {
  mainFn = fn || null;
  if (!tg) return;
  tryTg(() => {
    const MB = tg.MainButton;
    if (!text) { MB.hideProgress(); MB.hide(); return; }
    MB.setParams({ text, is_visible: true, is_active: true });
  });
}
function mainProgress(on) {
  mainBusy = on;
  if (tg) tryTg(() => on ? tg.MainButton.showProgress(false) : tg.MainButton.hideProgress());
}
function closingGuard(on) { if (ver('6.2')) tryTg(() => on ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation()); }

// ---------- drobiazgi --------------------------------------------------------------------------------------------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let skew = 0;  // zegar laptopa minus zegar telefonu [s], z /api/state now
const now = () => Date.now() / 1000 + skew;
const pl = n => String(n).replace('.', ',');
function plural(n, one, few, many) {
  const t = n % 100, u = n % 10;
  return n === 1 ? one : (u >= 2 && u <= 4 && (t < 12 || t > 14)) ? few : many;
}
function dur(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return `${s} s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  if (h < 48) return `${h} h ${String(m % 60).padStart(2, '0')} min`;
  return `${Math.floor(h / 24)} d ${h % 24} h`;
}
function rel(ts) {
  if (!ts) return '';
  const d = now() - ts;
  if (d < 45) return 'przed chwilą';
  if (d < 3600) return `${Math.round(d / 60)} min temu`;
  if (d < 86400) return `${Math.round(d / 3600)} h temu`;
  const days = Math.round(d / 86400);
  return days <= 1 ? 'wczoraj' : `${days} dni temu`;
}
function clock(ts) {
  if (!ts) return '—';
  const d = new Date(ts * 1000), t = new Date(now() * 1000), p = x => String(x).padStart(2, '0');
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  if (d.toDateString() === t.toDateString()) return `dziś ${hm}`;
  if (d.toDateString() === new Date(t - 864e5).toDateString()) return `wczoraj ${hm}`;
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}${d.getFullYear() !== t.getFullYear() ? '.' + d.getFullYear() : ''} ${hm}`;
}
function size(b) {
  if (b == null) return '';
  if (b < 1024) return `${b} B`;
  const u = ['kB', 'MB', 'GB', 'TB']; let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
  return `${pl(b >= 100 ? Math.round(b) : b.toFixed(1))} ${u[i]}`;
}
let toastTimer;
function toast(msg, bad, ms) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, ms || 3200);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* brak API albo zgody: stary sposób niżej */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { /* nie da się */ }
  ta.remove();
  return ok;
}
async function copyTap(text, el) {
  if (!await copyText(text)) { haptic('error'); return toast('Kopiowanie niedostępne – przytrzymaj tekst.', true); }
  haptic('success'); toast('📋 skopiowano', false, 1200);
  if (el) { el.classList.add('copied'); setTimeout(() => el.classList.remove('copied'), 700); }
}

// ---------- API ----------------------------------------------------------------------------------------------------
const MAX_FILE = 50 * 1024 * 1024;  // tyle przepuszczają /send i /file (web.py MAX_FILE, limit Bot API)
class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
let authLost = false, limitedUntil = 0;
async function api(method, path, body, opt = {}) {
  if (authLost) throw new ApiError(401, 'Brak dostępu.');
  const headers = { 'X-Init-Data': initData };
  if (method === 'POST') headers['Content-Type'] = 'application/json';
  let r;
  try {
    r = await fetch(path, { method, headers, cache: 'no-store', credentials: 'same-origin',
      body: method === 'POST' ? JSON.stringify(body || {}) : undefined });
  } catch (e) {
    net('📡 Brak połączenia z laptopem (Tailscale / internet?).');
    throw new ApiError(0, 'Brak połączenia z laptopem.');
  }
  if (r.status === 401) { authLost = true; showAuth(); throw new ApiError(401, 'Brak dostępu.'); }
  if (r.status === 429) {
    limitedUntil = Date.now() + 10 * 60e3;
    const m = '⏳ Za dużo nieudanych prób z tego adresu. Odczekaj ok. 10 minut i spróbuj ponownie.';
    net(m); throw new ApiError(429, m);
  }
  if (r.status >= 500) { net(`⚠️ Serwer panelu zwrócił błąd ${r.status}.`); throw new ApiError(r.status, `Błąd serwera (${r.status}).`); }
  net('');
  if (!r.ok) {
    let msg = '';
    try { msg = (await r.json()).error || ''; } catch (e) { /* bez treści */ }
    throw new ApiError(r.status, msg || ({ 404: 'Nie ma takiego zadania albo pliku (usunięte?).',

/* Postęp z przepisów md/charmm: "etap 5/6: Produkcja 42% (krok …), koniec etapu ok. 09.11 18:20; do końca całości

function parseEta(p) {
  p = p || '';
  const o = { head: p.split('; do końca całości')[0].replace(/, (koniec (etapu|kroku)|etap jeszcze) .*$/, '') };
  let m;
  if ((m = p.match(/(\d+(?:\.\d+)?)%/))) o.pct = Math.min(100, parseFloat(m[1]));
  if ((m = p.match(/do końca całości ~(.+?)(?: \(ok\. ([^)]+)\))?\s*$/))) { o.total = m[1]; o.totalAt = m[2]; }
  if ((m = p.match(/koniec (?:etapu|kroku) (?:ok\. ([\d.]+ [\d:]+)|~([^,;(]+?)(?: \(ok\. ([^)]+)\))?)\s*(?=[,;]|$)/))) {
    o.stageLeft = m[2]; o.stageAt = m[1] || m[3];
  } else if ((m = p.match(/etap jeszcze ~([^,;]+)/))) o.stageLeft = m[1];
  else if ((m = p.match(/koniec ok\. (.+)$/))) o.stageAt = m[1];

}
/* "10.11 03:25" (czas laptopa) → sekundy od teraz według zegara laptopa; null, gdy nie da się odczytać albo już minęło. */
function untilAt(at) {
  const m = /^(\d\d)\.(\d\d) (\d\d?):(\d\d)$/.exec(at || '');
  if (!m) return null;
  const t = new Date(now() * 1000);
  let d = new Date(t.getFullYear(), +m[2] - 1, +m[1], +m[3], +m[4]);
  if (d - t < -180 * 864e5) d = new Date(t.getFullYear() + 1, +m[2] - 1, +m[1], +m[3], +m[4]);  // przełom roku
  const left = (d - t) / 1000;

}
function etaHtml(e) {

  const left = untilAt(e.totalAt);
  if (e.total) bits.push(`<b>całość: ~${esc(left != null ? dur(left) : e.total)}</b>${e.totalAt ? ` (ok. ${esc(e.totalAt)})` : ''}`);
  return (e.pct != null ? `<div class="pbar"><i style="width:${e.pct}%"></i></div>` : '') +
    (bits.length ? `<div class="eta">⏱ ${bits.join(' · ')}</div>` : '');

  charmm: [['Paczka', ['engine', 'steps']], ['Produkcja', ['ns', 'T']]],
};
/* Parametry, które przy danym ustawieniu nic nie zmieniają (wyszarzone, nie blokowane). */
const RELEVANT = {
  qsar: { split_col: v => v.split === 'column' || 'tylko przy split=column', every: v => v.split === 'sorted' || 'tylko przy split=sorted',
    test: v => ['ks', 'random'].includes(v.split) || 'tylko przy split=ks albo random' },
  dock: { size: v => !!v.center || 'używany razem z center' },
};
const F = { mode: '', recipe: '', R: null, base: {}, vals: {}, defaults: {}, serverError: '', serverParam: '', keep: false, owner: null };
const num2s = n => String(+n);
function canon(P, v) {
  if (v == null) return '';
  const t = Array.isArray(v) ? v : String(v).trim();
  switch (P.kind) {
    case 'bool': return typeof v === 'boolean' ? (v ? 'tak' : 'nie') : ['1', 'tak', 'yes', 'true', 'on'].includes(t.toLowerCase()) ? 'tak' : 'nie';
    case 'list': return (Array.isArray(t) ? t : t.split(',')).map(x => String(x).trim()).filter(Boolean).join(',');
    case 'vec3': {
      const parts = Array.isArray(t) ? t : t.replace(/,/g, ' ').split(/[;/ ]+/).filter(Boolean);
      return parts.length === 3 && parts.every(x => x !== '' && isFinite(+x)) ? parts.map(num2s).join(',') : String(t);
    }
    case 'int': case 'float': { if (t === '') return ''; const n = Number(t.replace(',', '.')); return isFinite(n) ? num2s(n) : t; }
    case 'choice': return P.choices.includes(t.toLowerCase()) ? t.toLowerCase() : t;
    default: return t;
  }
}
function check(p, s) {
  const P = F.R.params[p];
  const range = `${P.low != null ? P.low : '…'}–${P.high != null ? P.high : '…'}`;
  switch (P.kind) {
    case 'int': case 'float': {
      if (s === '') return 'Podaj liczbę.';
      const n = Number(s);
      if (!isFinite(n)) return P.kind === 'int' ? 'Oczekuję liczby całkowitej.' : 'Oczekuję liczby (np. 0.5).';
      if (P.kind === 'int' && !Number.isInteger(n)) return 'Oczekuję liczby całkowitej.';
      if ((P.low != null && n < P.low) || (P.high != null && n > P.high)) return `Poza zakresem ${range}.`;
      return '';
    }
    case 'vec3':
      if (s === '') return F.base[p] === '' ? '' : 'Podaj trzy liczby x, y, z (wyczyścić tu się nie da – ↺).';
      return s.split(',').length === 3 && s.split(',').every(x => x !== '' && isFinite(+x)) ? '' : 'Podaj trzy liczby x, y, z.';
    case 'list':
      if (!s) return 'Wybierz co najmniej jedną pozycję.';
      return s.split(',').some(x => P.choices.length && !P.choices.includes(x)) ? 'Nieznana pozycja.' : '';
    case 'choice': return P.choices.includes(s) ? '' : `Możliwe: ${P.choices.join(', ')}.`;
    case 'str':
      if (s.length > 200) return 'Najwyżej 200 znaków.';
      return s === '' && F.base[p] !== '' ? 'Pustej wartości nie da się wysłać – przywróć poprzednią (↺).' : '';
    default: return '';
  }
}

function describe(r, v) {
  const L = [];
  if (r === 'md') {
    L.push(`${v.pdb ? 'PDB ' + v.pdb : 'struktura z wysłanego pliku'}${v.chains ? ', łańcuchy ' + v.chains : ''}; ${v.ff}, woda ${v.water}, pudełko ${v.box} (${v.d} nm), NaCl ${v.salt} M`);
    L.push(`równowagowanie: NVT ${v.nvt_ps} ps + NPT ${v.npt_ps} ps`);
    L.push(`**produkcja ${v.ns} ns w ${v.T} K (${String(v.ensemble).toUpperCase()})**, silnik ${v.engine}${v.mdp ? ', mdp: ' + v.mdp : ''}`);
    if (+v.ns >= 20) L.push('⚠️ Długa produkcja – na 2 rdzeniach to zwykle wiele dni; ETA pojawi się po starcie produkcji.');
    if (+v.T >= 450 && v.ensemble === 'npt') L.push('💡 W wysokiej T do rozwijania białka lepsze jest ensemble=nvt.');
  } else if (r === 'qsar') {
    L.push(`odpowiedź: ${v.target || 'zgadnij'}, SMILES: ${v.smiles || 'zgadnij'}`);
    L.push(`podział ${v.split}${v.split === 'sorted' ? ' (co ' + v.every + '. do testu)' : v.split === 'column' ? ' z kolumny ' + (v.split_col || '?') : ' (test ' + v.test + ')'}`);
    L.push(`**deskryptory: ${v.descriptors}; do ${v.max_desc} w modelu, wybór ${v.select}**`);
    L.push(`modele: ${v.models}; Y-scrambling ×${v.scramble}`);
  } else if (r === 'omics') {
    L.push(`${v.layer}; grupa „${v.group}”${v.ref ? ', odniesienie ' + v.ref : ''}${v.covariates ? ', kowariaty ' + v.covariates : ''}`);
    L.push(`braki: ${v.impute}, normalizacja ${v.normalize}, dryf ${v.drift}, partie ${v.batch}`);
    L.push(`**test ${v.test}, FDR ${v.fdr}, |log2 FC| ≥ ${v.fc}**; UniProt: ${v.annotate}, g:Profiler: ${v.enrich}`);
  } else if (r === 'dock') {
    const box = v.center ? `środek ${v.center}, ${v.size} Å` : v.ligand_ref ? `z ligandu ${v.ligand_ref}` : v.residues ? `z reszt ${v.residues}` : 'automatycznie';
    L.push(`receptor: ${v.receptor || 'z pliku'}; pudełko: ${box} (+${v.padding} Å)`);
    L.push(`**${v.scoring}, exhaustiveness ${v.exhaustiveness}, ${v.poses} póz**, pH ${v.ph}${v.keep_waters === 'tak' ? ', z wodami krystalicznymi' : ''}`);
  } else if (r === 'charmm') {
    L.push(`folder ${v.engine}; kroki: ${v.steps || 'wszystkie z README'}`);
    L.push(`**produkcja ${+v.ns ? v.ns + ' ns' : 'jak w paczce'}, T ${+v.T ? v.T + ' K' : 'jak w paczce'}**`);
  }
  return L.map(l => esc(l).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'));
}

// ---------- Przewodnik: lista tematów → temat ---------------------------------------------------------------------
/* Tekst tematu to HTML Telegrama: tylko <b>, <i>, <code>, <pre> i encje &lt; &gt; &amp;. Te cztery znaczniki zostają,
   wszystko inne (każdy inny znacznik, atrybut, encja) wychodzi jako zwykły tekst. Niedomknięte domyka się samo. */
const G_TAG = /<\/?(?:b|i|code|pre)>/g;
function guideHtml(text) {
  const plain = s => s.replace(/&(?!(?:lt|gt|amp);)/g, '&amp;').replace(/[<>"']/g, c => ({ '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const open = [];
  let out = '', last = 0, m;
  text = String(text == null ? '' : text).replace(/\n?(<pre>)\n?/g, '$1').replace(/\n?(<\/pre>)\n?/g, '$1');
  G_TAG.lastIndex = 0;
  while ((m = G_TAG.exec(text))) {
    out += plain(text.slice(last, m.index)); last = G_TAG.lastIndex;
    const name = m[0].replace(/[</>]/g, '');
    if (m[0][1] !== '/') { open.push(name); out += m[0]; }
    else if (open[open.length - 1] === name) { open.pop(); out += m[0]; }
    else out += plain(m[0]);  // zamknięcie nie do pary: jako tekst
  }
  out += plain(text.slice(last));
  while (open.length) out += `</${open.pop()}>`;
  return out;
}

}

  pick: el => { haptic('select'); setVal(el.dataset.p, el.dataset.v, true); },
  quick: el => { haptic('select'); const i = $(`input[data-in="${el.dataset.p}"]`); if (i) i.value = el.dataset.v; setVal(el.dataset.p, el.dataset.v); },
  tog: el => {
    haptic('select');
    const p = el.dataset.p, P = F.R.params[p], on = new Set(F.vals[p].split(',').filter(Boolean));
    if (on.has(el.dataset.v)) on.delete(el.dataset.v); else on.add(el.dataset.v);
    setVal(p, P.choices.filter(c => on.has(c)).join(','), true);
  },
  allNone: el => { const p = el.dataset.p, P = F.R.params[p]; setVal(p, F.vals[p].split(',').length === P.choices.length ? '' : P.choices.join(','), true); },
  reset: el => { haptic('select'); setVal(el.dataset.p, F.base[el.dataset.p], true); },
};
document.addEventListener('click', e => {
  const code = e.target.closest('.guide pre, .guide code');
  if (code) return copyTap(code.textContent, code);
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.closest('summary')) e.preventDefault();
  const fn = ACTS[el.dataset.act];
  if (fn) fn(el, e);
});
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov' || e.target.id === 'ovImg') closeOv(); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in && el.type !== 'checkbox' && el.tagName !== 'SELECT') setVal(el.dataset.in, readInput(el));
  if (el.id === 'fileFilter') { J.filter = el.value; $('#fileList').outerHTML = fileListHtml(J.data); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.in && (el.type === 'checkbox' || el.tagName === 'SELECT')) { haptic('select'); setVal(el.dataset.in, readInput(el)); }
});
document.addEventListener('toggle', e => {
  if (e.target.id === 'logBox') { J.logOpen = e.target.open; if (J.logOpen) loadLog(); }
}, true);

// przeciągnij w dół, aby odświeżyć (Kolejka i Zadanie)
(() => {
  const ptr = $('#ptr'); let y0 = null, dy = 0;
  document.addEventListener('touchstart', e => {
    const ok = window.scrollY <= 0 && ['home', 'job'].includes(cur().name) && !$('#ov').classList.contains('show');
    y0 = ok ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    const d = Math.min(dy / 2, 70);
    ptr.style.transform = `translateY(${d - 40}px)`; ptr.style.opacity = Math.min(1, d / 60);
    ptr.textContent = d >= 60 ? '↻ Puść, aby odświeżyć' : '↓ Przeciągnij, aby odświeżyć';
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (y0 != null && dy / 2 >= 60) { haptic('light'); refresh(); toast('↻ Odświeżam…'); }
    y0 = null; ptr.style.transform = ''; ptr.style.opacity = 0;
  }, { passive: true });
})();

// ---------- start ----------------------------------------------------------------------------------------------------
if (!tg || !initData) showAuth();
else { go('home'); pollState(); }
</script>
</body>
</html>
